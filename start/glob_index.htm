<script language="javaScript">
/*
Anmerkung zur Anwendung
Diese Seite kann zum Navigieren in mehreren CIC-Sites ergänzt werden. Dazu sind
die  folgenden Beispiel-Zeilen weiter unten entsprechend zu modifizieren. 
Es können beliebig viele Einträge vorgenommen werden, es müssen aber jeweils gleichviel Einträge sein.
Diese Seite ist dann in das den CIC-Sites übergeordnete Verzeichnis
zu stellen.

This page can be used to navigate in a set of CICs. 
Therefore, modify the following lines by actualizing the entries.
Number of entries is free.
The page should be placed in the parent directory of the CIC-set.

projects: use PKZ
documents: free description of the concerned CIC
cicNumbers: number from cic directory name

	var projects   = new Array("PRO001","PRO002","PRO003");
	var documents  = new Array("Turbine","Service","Nonsense");
	var cicNumbers = new Array("1286","1315","1322");



*/
// This part to modify
var projects   = new Array("BRD999","BRD999","BRD999","BRD999","BRD999","BRD999");
var documents  = new Array("Turbine","Service","Nonsense","Games","Handbook","Firework");
var cicNumbers = new Array("1286","1315","1322","1323","1324","1326");
var startPage  = "/start/index.htm";
// end

// Do not modify this part 
function writeProjectList() {
var bgc="";
var cicNo="";
for(i=0;i<projects.length;i++) {
	while(5-cicNumbers[i].length) cicNumbers[i]="0"+cicNumbers[i];
	bgc = (i % 2) ? "#99CCFF" : "#FFFF99";
	cicNo="CIR" + cicNumbers[i];
	document.write("<tr style='background-color:"+bgc+";'><td>" + projects[i] + "</td>");
	document.write("<td><a href='"+cicNo + startPage + "' target='_cicPage'>" + documents[i] + "</a></td>");
	document.write("<td>" + cicNo + "</td></tr>");
	}
}

</script>
